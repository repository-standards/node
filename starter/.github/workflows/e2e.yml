# E2E (Playwright) + integration + advisory Lighthouse. A TEMPLATE for an adopting repo
# (this file does not run in the standard's own repo). Separate from ci.yml's fast
# quality gate: this tier is slower (boots the Docker test-stack and the app), so it runs
# on its own and is the one you gate a release on. Hardened per DECISIONS.md #11 (explicit
# least-privilege permissions, pnpm cache, frozen lockfile); pin third-party actions by SHA.

name: e2e

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: pnpm/action-setup@b307475762933b98ed359c036b0e51f26b63b74b # v5.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Real backing services for the integration + e2e tiers (docker-compose.test.yml).
      - name: Bring up the test-stack
        run: pnpm bootstrap:test-stack

      - name: Integration tests (Vitest, against the test-stack)
        run: pnpm test:integration

      - name: Build the app under test
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: pnpm test:e2e

      # Advisory by default - reports, does not block (lighthouserc.json). Never fails the
      # job on its own; `|| true` keeps a flaky perf number off the critical path.
      - name: Lighthouse budgets (advisory)
        # continue-on-error keeps the budget advisory WITHOUT swallowing a broken
        # invocation - a missing script or crashed run still shows red on the step.
        continue-on-error: true
        run: pnpm test:perf

      - name: Tear down the test-stack
        if: always()
        run: pnpm teardown:test-stack

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
