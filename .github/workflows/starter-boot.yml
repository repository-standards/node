# This repo's OWN gate: the starter must stay boot-verified, not boot-verified-once.
# (starter/.github/workflows/ are TEMPLATES an adopter enables in their repo.)
name: starter-boot
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly heartbeat - the claim needs a pulse
permissions:
  contents: read
jobs:
  boot:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: starter
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: starter/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: starter/.nvmrc
          cache: pnpm
          cache-dependency-path: starter/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Supply-chain policy is live, not decorative
        # All three policy keys must be in pnpm's effective config - a renamed or
        # typo'd key would leave the axis green and inert (version skew is real).
        run: |
          test "$(pnpm config get minimumReleaseAge)" = "10080"
          test "$(pnpm config get enablePrePostScripts)" = "false"
          test "$(pnpm config get saveExact)" = "true"
          pnpm config get allowBuilds | grep -q "esbuild"
      - run: pnpm check:all
      - run: pnpm build
      - run: pnpm test:unit
      - name: Test-stack up (integration tier)
        run: docker compose -f docker-compose.test.yml up -d --wait
      - run: pnpm test:integration
      - name: Playwright browsers
        run: pnpm --filter e2e exec playwright install --with-deps chromium
      - name: The marquee journey - sign-up reaches the dashboard
        run: pnpm test:e2e
      - name: Test-stack down
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
