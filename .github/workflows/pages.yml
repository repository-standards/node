# Deploys this stack's site (landing + docs rendered by the CORE's generator -
# one form, many sites). Needs both repos public + Pages enabled (Source: Actions).
name: pages
# DISABLED for now (owner call): manual trigger only. To go live, restore the
# push trigger below and enable Pages (Settings -> Pages -> Source: GitHub Actions).
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: bodurkalukasz/repository-standards
          # Deliberately tracks the core's main until the core cuts tags - a recorded
          # exception to exact pinning: the site build follows the shared generator.
          ref: main
          path: .core-tools
          sparse-checkout: tools
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24.18.0"
      - run: node .core-tools/tools/docsite.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
